name: E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: shopping-e2e-tests

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shopping-e2e-tests/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Check target site reachability from this runner
        run: |
          curl -sS -D - -o response.html -w "\nHTTP Status: %{http_code}\n" https://practicesoftwaretesting.com || true
          echo "--- first 2KB of response body ---"
          head -c 2000 response.html || true

      - name: Run E2E test suite
        env:
          HEADLESS: "true"
        run: pytest

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: shopping-e2e-tests/reports/report.html
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: shopping-e2e-tests/screenshots/
          retention-days: 14
          if-no-files-found: ignore
